<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clueless AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 75%, #533483 100%);
            color: #ffffff;
        }

        /* ── Floating glass panel ── */
        .card {
            background: rgba(28, 28, 35, 0.72);
            backdrop-filter: blur(28px) saturate(160%);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 18px;
            padding: 32px 24px 28px;
            width: 300px;
            text-align: center;
            box-shadow:
                0 2px 0 rgba(255,255,255,0.06) inset,
                0 24px 64px rgba(0, 0, 0, 0.55),
                0 4px 16px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: rgba(255,255,255,0.92);
            margin-bottom: 24px;
        }

        /* ── Buttons ── */
        button {
            width: 100%;
            padding: 10px 20px;
            margin-bottom: 10px;
            border: none;
            border-radius: 20px;
            font-size: 13.5px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.15s ease, background 0.15s ease;
            letter-spacing: 0.01em;
        }

        button:active { transform: scale(0.96); }

        #start-session {
            background: linear-gradient(135deg, #4f8ef7, #2563eb);
            color: #fff;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
        }
        #start-session:hover { opacity: 0.88; }

        #stop-session {
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #stop-session:hover {
            background: rgba(255, 255, 255, 0.13);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.28);
        }

        /* ── Status pill ── */
        #status {
            display: inline-block;
            margin-top: 18px;
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.38);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Be Clueless</h1>

        <button id="start-session">Start Session</button>
        <button id="stop-session">Stop Session</button>

        <p id="status">Idle</p>
    </div>

    <script>
        const startButton = document.getElementById("start-session");
        const stopButton = document.getElementById("stop-session");
        const status = document.getElementById("status");

        async function checkSessionState() {
            const state = await window.app.getSessionState();
            if (state.active) {
                status.textContent = "Session is active";
            } else {
                status.textContent = "Session is stopped";
            }
        }

        checkSessionState();

        async function updateSessionStatus() {
            const state = await window.app.getSessionState();
            status.textContent = state.active
                ? "Session is active"
                : "Session is stopped";
        }

        startButton.addEventListener("click", async () => {
            await window.app.startSession();
            await updateSessionStatus();
        });

        stopButton.addEventListener("click", async () => {
            await window.app.stopSession();
            await updateSessionStatus();
        });

        updateSessionStatus();
    </script>
</body>
</html>
