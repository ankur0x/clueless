<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Window</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 45%, #7e22ce 100%);
            color: #f5f3ff;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
            text-align: center;
        }

        #messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 320px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding-right: 4px;
        }

        #messages:empty::before {
            content: "No messages yet";
            display: block;
            text-align: center;
            font-size: 13px;
            color: #c4b5fd;
            padding: 12px 0;
        }

        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 70%;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user {
            align-self: flex-end;
            background: rgba(167, 139, 250, 0.18);
            border: 1px solid rgba(167, 139, 250, 0.3);
        }

        .assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        #message-input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.07);
            color: #f5f3ff;
            font-size: 14px;
            outline: none;
        }

        #message-input::placeholder {
            color: #c4b5fd;
        }

        #message-input:focus {
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.1);
        }

        #send-message {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #a78bfa, #7c3aed);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        #send-message:hover { opacity: 0.9; }
        #send-message:active { transform: scale(0.97); }
    </style>
</head>

<body>
    <div class="card">
        <h1>Chat</h1>

        <div class="ai-controls">
            <label>
                Provider
                <select id="provider-select">
                    <option value="groq">Groq</option>
                    <option value="gemini">Gemini</option>
                </select>

            </label>

            <label>
                Model
                <select id="model-select"></select>
            </label>

            <button id="refresh-models">
                    Refresh Models
            </button>
        </div>

        <div id="messages"></div>

        <div class="input-row">
            <input
                id="message-input"
                type="text"
                placeholder="Type a message..."
            />

            <button id="send-message">
                Send
            </button>
        </div>
    </div>

    <script>
        const messageInput = document.getElementById("message-input");
        const sendButton = document.getElementById("send-message");
        const messagesContainer = document.getElementById("messages");

        const providerSelect = document.getElementById("provider-select");
        const modelSelect = document.getElementById("model-select");

        const refreshModelsButton = document.getElementById("refresh-models");

        async function loadAISettings() {
            const providerResult = await window.app.getAIProvider();

            providerSelect.value = providerResult.provider;

            await loadModels();

            const modelResult = await window.app.getAIModel();

            modelSelect.value = modelResult.model;
        }

        async function loadModels() {
            const result = await window.app.getAIModels();

            modelSelect.innerHTML = "";

            if (!result || !result.models) {
                return;
            }

            result.models.forEach(model => {
                const option = document.createElement("option");

                option.value = model;
                option.textContent = model;

                modelSelect.appendChild(option);
            });
        }

        providerSelect.addEventListener("change", async () => {
            const provider = providerSelect.value;

            const result = await window.app.setAIProvider(provider);

            if (!result.success) {
                console.error(result.message);
                return;
            }

            await loadModels();

            modelSelect.value = result.model;
        });

        modelSelect.addEventListener("change", async () => {
            const model = modelSelect.value;

            const result = await window.app.setAIModel(model);

            if (!result.success) {
                console.error(result.message);
            }
        });

        loadAISettings();

    

        function renderMessages(messages) {
            messagesContainer.innerHTML = "";

            messages.forEach((message) => {
                const messageElement = document.createElement("div");

                messageElement.classList.add("message");
                messageElement.classList.add(message.role);

                messageElement.textContent = message.content;

                messagesContainer.appendChild(messageElement);

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }


        function addMessage(role, content) {
            const messageElement = document.createElement("div");

            messageElement.classList.add("message");
            messageElement.classList.add(role);

            messageElement.textContent = content;

            messagesContainer.appendChild(messageElement);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function loadMessages() {
            const messages = await window.app.getMessages();

            renderMessages(messages);
        }

        sendButton.addEventListener("click", async () => {
            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            sendButton.disabled = true;
            sendButton.textContent = "Sending...";

            try {
                addMessage("user", message);
                messageInput.value = "";

                const result = await window.app.sendMessage(message);

                if (result.success) {
                    await loadMessages();
                } else {
                    addMessage("assistant", `Error: ${result.message}`);
                }
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Send";
                messageInput.focus();
            }
        });


        messageInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                sendButton.click();
            }
        });

        loadMessages();

        refreshModelsButton.addEventListener("click", async () => {
            refreshModelsButton.disabled = true;
            refreshModelsButton.textContent = "Refreshing...";

            try {
                const currentModelResult = await window.app.getAIModel();
                const result = await window.app.refreshAIModels();

                if (!result.success) {
                    addMessage("assistant", `Error: ${result.message}`);
                    return;
                }

                modelSelect.innerHTML = "";

                result.models.forEach(model => {
                    const option = document.createElement("option");

                    option.value = model;
                    option.textContent = model;

                    modelSelect.appendChild(option);
                });

                if (result.models.length === 0) {
                    addMessage("assistant", "No models are currently available.");
                    return;
                }

                if (result.models.includes(currentModelResult.model)) {
                    modelSelect.value = currentModelResult.model;
                } else {
                    modelSelect.value = result.models[0];

                    await window.app.setAIModel(result.models[0]);
                }

            } finally {
                refreshModelsButton.disabled = false;
                refreshModelsButton.textContent = "Refresh Models";
            }
        });
    </script>
</body>
</html>
